seed: 42
device: "cuda"
split_names: ["train_set", "test_set", "eval_set"]
registry_path: "outputs/intent_registry.json"  

dataset:
  name: "qanastek/MASSIVE"
  languages: ["en-US"]
  columns: ["id", "utt", "intent", "locale"] 
  lang: "locale"
  text: "utt"
  label: "intent"
  
  # Number of classes is derived at runtime from the intent registry (see registry_path),
  # not hardcoded: pretrain phase = len(pretrain_intents), growing as new intents are learned.
  # pretrain intents: # 15 intents
  #   play_music:            1
  #   audio_volume_down:     5
  #   audio_volume_mute:     7
  #   audio_volume_up:      10
  #   play_game:            14
  #   weather_query:        19
  #   news_query:           20
  #   transport_taxi:       24
  #   play_audiobook:       35
  #   email_addcontact:     36
  #   lists_createoradd:    37
  #   play_radio:           38
  #   datetime_query:       46
  #   transport_query:      51
  #   alarm_set:            55
  pretrain_intents: [1, 5, 7, 10, 14, 19, 20, 24, 35, 36, 37, 38, 46, 51, 55]
# reserve intents (to-learn): # 5 intents
  #   takeaway_order:           25
  #   general_joke:             31
  #   recommendation_locations: 32
  #   transport_traffic:        47
  #   play_podcasts:            48
  reserve_intents: [25, 31, 32, 47, 48]


teacher:
  name: "microsoft/deberta-v3-large"
  epochs: 15
  lr: 1.0e-5
  decay: 0.01
  patience: 5
  batch_size: 16
  warm-up: 0.1
  class_weights: "sqrt_inv"
  output_dir: "outputs/checkpoints/teacher_xlmr"

student1: 
  name: "jhu-clsp/ettin-encoder-68m"
  epochs: 20
  lr: 5.0e-5
  decay: 0.01
  patience: 5
  batch_size: 32
  warm-up: 0.1
  class_weights: "sqrt_inv"
  output_dir: "outputs/checkpoints/student_ettin_68m"
  temperature: 3.0
  alpha: 0.3 #0.7

student2: 
  name: "jhu-clsp/  "


student3:
  name: "nreimers/MiniLM-L6-H384-uncased"
  epochs: 40
  lr: 3.0e-5
  decay: 0.01 
  patience: 5 #3
  batch_size: 32
  #output_dir: "outputs/checkpoints/student2_minilm_l6"
  warm-up: 0.1
  temperature: 3.0
  alpha: 0.3 #0.7
