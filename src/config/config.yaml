seed: 42
device: "cuda"
split_names: ["train_set", "test_set", "eval_set"]

dataset:
  name: "qanastek/MASSIVE"
  languages: ["en-US"]
  lang: "locale"
  text: "utt"
  label: "intent"
  num_labels: 60


