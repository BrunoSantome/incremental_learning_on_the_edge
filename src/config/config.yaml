paths:
  checkpoints: "outputs/checkpoints"
  logs: "outputs/logs"
  figures: "outputs/figures"

#### For testing purposes only #####

#Teacher Model
xlm-roBERTa-L:
  name: "FacebookAI/xlm-roberta-large" #for tokenizer
  checkpoint_dir: "outputs/checkpoints/Teacher_XLM-R-L"
  batch_size: 16

#Student model Directly fine tuned
minilm-l6-direct:
  name: "nreimers/MiniLM-L6-H384-uncased"
  checkpoint_dir: "outputs/checkpoints/MiniLM-L6-Direct-FineTune"
  batch_size: 32

distilmBERT-direct:
  name: "distilbert-base-multilingual-cased" #for tokenizer
  checkpoint_dir: "outputs/checkpoints/DistilmBERT-Direct-FineTune"
  batch_size: 32

#Student model distilled
minilm-l6-distilled: 
  name: "nreimers/MiniLM-L6-H384-uncased"
  checkpoint_dir: "outputs/checkpoints/MiniLM-L6-Distilled"
  batch_size: 32
distilmBERT-distilled:
  name: "distilbert-base-multilingual-cased" #for tokenizer
  checkpoint_dir: "outputs/checkpoints/DistilmBERT-Distilled"
  batch_size: 32
