teacher2:
  name: "FacebookAI/xlm-roberta-large"
  epochs: 15
  lr: 5.0e-6
  decay: 0.1
  patience: 5
  batch_size: 16
  output_dir: "outputs/checkpoints/teacher_xlmr2"
  warm-up: 0.1

student1:
  name: "distilbert-base-multilingual-cased"
  epochs: 15
  lr: 3.0e-5
  decay: 0.01
  patience: 3
  batch_size: 32
  output_dir: "outputs/checkpoints/student1_distilbert"
  warm-up: 0.1
  temperature: 3.0
  alpha: 0.7

student2:
  name: "nreimers/MiniLM-L6-H384-uncased"
  epochs: 40
  lr: 3.0e-5
  decay: 0.01 
  patience: 5 #3
  batch_size: 32
  output_dir: "outputs/checkpoints/student2_minilm_l6"
  warm-up: 0.1
  temperature: 3.0
  alpha: 0.3 #0.7

